name: springfydrt
description: "App musicianas"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.2.0
  ffi: ^2.1.0
  drift: ^2.14.1



  just_audio_media_kit: ^2.1.0
  shared_preferences: ^2.5.5
  preload_page_view: 0.2.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  wakelock_plus: ^1.2.8
  web_socket_channel: ^2.4.0

  http: ^1.6.0
  path_provider: ^2.1.2
  connectivity_plus: ^6.0.3
  rxdart: ^0.27.7
  audio_service: ^0.18.19
  just_audio: ^0.9.36
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4

  flutter_pcm_sound: ^3.3.3
  mp_audio_stream: ^0.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
