# yaml-language-server: $schema=https://json.schemastore.org/codemagic.yaml
workflows:
  ios-altsave-workflow:
    name: Build iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Obtener dependencias de Flutter y generar archivos nativos
        script: |
          
          # Esto regenera la carpeta ios limpia y el Podfile oficial actualizado al SDK actual de Flutter
          flutter create . --platforms=ios
          flutter pub get

      - name: Instalar CocoaPods
        script: |
          cd ios
          pod install

      - name: Compilar IPA sin firmar
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa